name: Generate activity graph

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate activity-graph.svg
        uses: ashutosh00710/github-readme-activity-graph@v1.2.0
        with:
          github_user_name: ${{ github.repository_owner }}
          output_filepath: dist/activity-graph.svg
          theme: high-contrast

      - name: push activity-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: activity-graph-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
